# REQ-REL-01/02/03/04: CI gates — lint, Rust tests, Python E2E — on Linux, macOS, Windows.

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # REQ-REL-01: Lint gate — clippy + rustfmt.
  lint:
    name: Lint (${{ matrix.os }})
    # REQ-REL-04: three host OSes.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # REQ-REL-11: Cargo.lock must not be stale.
      - name: cargo update --locked
        run: cargo update --locked --workspace

  # REQ-REL-02: Rust test gate — cargo nextest, including golden fixtures.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # REQ-REL-11: reproducible build with --locked.
      - name: cargo nextest run
        run: cargo nextest run --locked

  # REQ-STACK-01: the declared MSRV must actually build. Every other job uses
  # `stable`, so without this `rust-version = "1.85"` in Cargo.toml is a claim
  # nothing verifies — and a stable-only feature can creep in unnoticed.
  msrv:
    name: Build on MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --locked --all-targets
        run: cargo check --locked --all-targets

  # REQ-EDIT-07/14: the Zed extension is its own crate, outside the workspace, so
  # `cargo nextest run` never compiles it — tests/zed_extension.rs only greps the
  # source as text. Without this job an API misuse or syntax error in lib.rs ships
  # undetected, and the failure surfaces to users as an extension that won't load.
  zed-extension:
    name: Build Zed extension (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - name: cargo build --release --target wasm32-wasip2
        working-directory: editors/zed
        run: cargo build --release --locked --target wasm32-wasip2

  # REQ-REL-03: Python E2E gate — pytest-lsp on Linux only.
  e2e:
    name: Python E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build --locked --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest-lsp
        run: pip install pytest pytest-lsp lsprotocol
      - name: Run pytest-lsp E2E suite
        env:
          JINJA_LSP_BINARY: ${{ github.workspace }}/target/release/jinja-lsp
        run: pytest tests/e2e/ -v
