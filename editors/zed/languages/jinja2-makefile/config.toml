name = "Jinja2 (Makefile)"
grammar = "jinja"
path_suffixes = ["Makefile.jinja", "Makefile.jinja2", "Makefile.j2", "makefile.jinja", "makefile.jinja2", "makefile.j2", "mk.jinja", "mk.jinja2", "mk.j2"]
autoclose_before = "<>})],;:"
block_comment = { start = "{# ", prefix = "", end = " #}", tab_size = 0 }
brackets = [
  { start = "{%", end = "%}", close = true, newline = false },
  { start = "{{", end = "}}", close = true, newline = false },
  { start = "{#", end = "#}", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false, not_in = ["comment", "string"] },
]
